services:
  - type: web
    name: seetheprep-api
    runtime: docker
    # Dockerfile lives in the API project; Docker context is repo root
    # so the COPY instructions in the Dockerfile can reference FoodPlatform.sln
    dockerfilePath: ./src/FoodPlatform.Api/Dockerfile
    dockerContext: .
    region: oregon
    # Free tier: spins down after 15 min of inactivity (~30s cold start).
    # Upgrade to plan: starter ($7/month) for always-on when ready to demo.
    plan: free
    healthCheckPath: /healthz
    envVars:
      # ── Non-secret config ────────────────────────────────────────────────
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: FoodPlatform
      - key: Jwt__Audience
        value: FoodPlatformApp
      - key: Cors__AllowedOrigins__0
        value: https://seetheprep.com
      - key: Cors__AllowedOrigins__1
        value: https://www.seetheprep.com
      - key: Cors__AllowedOrigins__2
        value: http://localhost:4200
      - key: Resend__FromAddress
        value: SeeThePrep <orders@seetheprep.com>
      # ── Secrets — set values in Render dashboard (sync: false = not in YAML) ─
      - key: ConnectionStrings__DefaultConnection
        value: "Host=localhost;Database=FoodPlatform;Username=postgres;" # Temporary dummy value so it boots
      - key: Jwt__Key
        generateValue: true   # Auto-generates a secure secret
      - key: Stripe__SecretKey
        value: sk_test_dummy
      - key: Stripe__WebhookSecret
        value: whsec_dummy
      - key: Resend__ApiKey
        value: re_dummy12345
      - key: Angelcam__AccessToken
        value: dummy_token
