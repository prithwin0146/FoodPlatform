name: Deploy API to Azure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/azure-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/FoodPlatform.Api/FoodPlatform.Api.csproj

      - name: Build
        run: dotnet build src/FoodPlatform.Api/FoodPlatform.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/FoodPlatform.Api/FoodPlatform.Api.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: seetheprep-api
          slot-name: production
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
