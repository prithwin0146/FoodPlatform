name: Deploy API to Render

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # Add RENDER_DEPLOY_HOOK_URL as a GitHub secret.
        # Get it from: Render dashboard → seetheprep-api → Settings → Deploy Hook
        # Render also auto-deploys on push via GitHub integration — this is a safety net.
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
