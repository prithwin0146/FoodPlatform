<div class="auth-page">
  <div class="auth-card card animate-scale-in">
    <div class="auth-header">
      <div class="logo-icon">🍽️</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your FoodPlatform account</p>
    </div>
    <form (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com"
          class="form-input" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••"
          class="form-input" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg auth-submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span> Signing in...
        } @else {
          Sign In →
        }
      </button>
    </form>
    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
